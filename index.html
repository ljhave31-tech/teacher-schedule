<!doctype html><html><head><link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#eaf3fc"><meta name="theme-color" content="#16202c" media="(prefers-color-scheme: dark)"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Teacher Schedule"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Teacher Schedule</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: soft rounded cards on a pale blue ground, a floating pill nav, a pill day picker that stays pinned,
   and a bottom sheet for editing. Blue = free (legend from the original sheet), peach = booked. */
:root {
  --bg: #eaf3fc;
  --card: #ffffff;
  --ink: #2c3e55;
  --mute: #7a90a9;
  --line: #e0ebf7;
  --accent: #3b78c0;
  --on-accent: #ffffff;
  --soft: #dcebfa;
  --free: #b6d5f5;
  --free-ink: #1c4a80;
  --booked: #fbdccb;
  --booked-ink: #7a3f22;
  --ring-free: #7fb2e8;
  --ring-book: #f2a58e;
  --bad: #c9604a;
  --star: #f2b84b;
  --shadow: 0 6px 20px rgba(50, 90, 140, .09);
  --ease: cubic-bezier(.2, .9, .25, 1);
  --f: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16202c; --card: #202d3c; --ink: #e9f1fa; --mute: #9bb1c9; --line: #304358;
    --accent: #8ebcf0; --on-accent: #0f2a47; --soft: #2a3f57; --free: #35567c; --free-ink: #d6e9fc;
    --booked: #5a3f33; --booked-ink: #fbdccb; --ring-free: #7fb2e8; --ring-book: #f2a58e; --bad: #ff9a8a;
    --shadow: 0 6px 20px rgba(0, 0, 0, .28); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16202c; --card: #202d3c; --ink: #e9f1fa; --mute: #9bb1c9; --line: #304358;
  --accent: #8ebcf0; --on-accent: #0f2a47; --soft: #2a3f57; --free: #35567c; --free-ink: #d6e9fc;
  --booked: #5a3f33; --booked-ink: #fbdccb; --ring-free: #7fb2e8; --ring-book: #f2a58e; --bad: #ff9a8a;
  --shadow: 0 6px 20px rgba(0, 0, 0, .28); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f); font-weight: 500; font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 120px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 520px; margin: 0 auto; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* header */
.hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 18px 10px; }
h1 { display: flex; align-items: center; gap: 12px; margin: 0; font-size: 22px; font-weight: 800; line-height: 1.15; }
h1 small { display: block; font-size: 13px; color: var(--mute); font-weight: 500; }
.hdr { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
.clock { font-size: 13px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock small { font-size: 10.5px; font-weight: 800; color: var(--accent); margin-right: 5px; letter-spacing: .04em; }
.gtxt { display: grid; min-width: 0; }
.gname { font-size: 22px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.logo { width: 42px; height: 42px; border-radius: 14px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.logo .ic { width: 24px; height: 24px; }
.sync { font-size: 11px; font-weight: 800; color: var(--mute); background: var(--card); box-shadow: var(--shadow); border-radius: 99px; padding: 5px 11px; white-space: nowrap; }

/* pinned picker */
#stick { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); padding-block: 4px 8px; }
#stick:empty { display: none; }
.tabs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; background: var(--card); border-radius: 99px; padding: 3px; box-shadow: var(--shadow); }
.tabs button { position: relative; border: 0; background: none; color: var(--mute); font-weight: 800; font-size: 11px; min-height: 40px; padding: 0 1px; border-radius: 99px; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.tabs button.today::after { content: ""; position: absolute; top: 5px; right: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--ring-book); }
.wgrid { display: grid; grid-template-columns: 34px 34px repeat(7, minmax(0, 1fr)); gap: 3px; align-items: center; }
.whead { background: var(--card); border-radius: 99px; box-shadow: var(--shadow); padding: 9px 14px; font-size: 9.5px; font-weight: 800; color: var(--mute); text-align: center; }

/* cards */
main { display: grid; gap: 14px; padding-block: 6px 16px; }
.card { background: var(--card); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.card.tight { padding: 14px; }
.hero-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hero-title { font-size: 17px; font-weight: 800; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; background: var(--soft); color: var(--accent); border-radius: 99px; padding: 5px 11px; }
.hero { display: flex; align-items: center; gap: 18px; }
.ring { position: relative; width: 116px; height: 116px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--mute); line-height: 1.1; }
.ring .mid b { font-size: 26px; color: var(--ink); font-weight: 800; }
.stats { flex: 1; display: grid; gap: 8px; min-width: 0; }
.stat { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--mute); gap: 8px; }
.stat b { font-size: 17px; color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }
.note { display: flex; gap: 9px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--soft); font-size: 13.5px; font-weight: 700; }
.note .ic { color: var(--accent); }
.banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 14px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); font-size: 13px; color: var(--mute); font-weight: 700; }
.link { border: 0; background: none; color: var(--accent); font-weight: 800; font-size: 13.5px; padding: 4px 2px; }

/* timetable */
.cols, .row { display: grid; grid-template-columns: 58px 38px minmax(0, 1fr); gap: 6px; align-items: center; }
.cols { font-size: 11px; font-weight: 800; color: var(--mute); }
.rows { display: grid; gap: 5px; }
.t { font-size: 13.5px; font-weight: 800; font-variant-numeric: tabular-nums; padding: 3px 6px; border-radius: 9px; white-space: nowrap; }
.t small { font-size: 9.5px; margin-left: 2px; opacity: .7; font-weight: 700; }
.t.vn { color: var(--mute); font-weight: 700; font-size: 12.5px; padding-inline: 0; }
.row.now .t.ph { background: var(--accent); color: var(--on-accent); }
.slot {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 44px; min-width: 0;
  border: 0; border-radius: 14px; background: var(--bg); color: var(--mute); text-align: left; padding: 0 14px; font-weight: 700;
}
.slot.free { background: var(--free); color: var(--free-ink); font-weight: 800; font-size: 12px; letter-spacing: .1em; }
.slot.booked { background: var(--booked); color: var(--booked-ink); font-weight: 800; }
.slot .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .rm { font-size: 11.5px; font-weight: 700; opacity: .8; white-space: nowrap; }

/* week */
.wrow { display: grid; grid-template-columns: 34px 34px repeat(7, minmax(0, 1fr)); gap: 3px; align-items: center; }
.wrow .t { font-size: 10.5px; padding: 0; text-align: center; }
.wrow .t.vn { font-weight: 700; }
.wc { height: 26px; border-radius: 8px; border: 0; background: var(--bg); padding: 0; font-size: 10px; font-weight: 800; }
.wc.free { background: var(--free); }
.wc.booked { background: var(--booked); color: var(--booked-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; font-weight: 700; color: var(--mute); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; background: var(--bg); }
.legend i.f { background: var(--free); }
.legend i.b { background: var(--booked); }

/* lists, forms */
.sec { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 4px 0; }
h2 { margin: 0; font-size: 16px; font-weight: 800; }
.emo { width: 40px; height: 40px; border-radius: 13px; background: var(--soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.cls { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; }
.cls h3 { margin: 0; font-size: 16px; font-weight: 800; overflow-wrap: anywhere; }
.cls .d { color: var(--mute); font-size: 13px; overflow-wrap: anywhere; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.pillbtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 99px; border: 0;
  background: var(--soft); color: var(--accent); font-weight: 800; font-size: 13.5px; text-decoration: none;
}
.pillbtn.danger { background: transparent; color: var(--bad); }
.empty { color: var(--mute); padding: 14px 4px; font-size: 14px; }
label { display: block; font-size: 12.5px; color: var(--mute); font-weight: 700; margin: 0 0 5px; }
input, select { width: 100%; min-height: 48px; border: 2px solid var(--line); background: var(--bg); border-radius: 14px; padding: 0 14px; font-size: 16px; font-weight: 500; outline: 0; }
input:focus, select:focus { border-color: var(--accent); }
.field { min-width: 0; }
.copyrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.save { width: 100%; border: 0; border-radius: 16px; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 16px; padding: 14px; }
.save.alt { background: var(--soft); color: var(--accent); }
.save.del { background: transparent; color: var(--bad); }
.fab {
  position: fixed; right: max(18px, calc(50% - 242px)); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 8; display: inline-flex; align-items: center; gap: 8px;
  border: 0; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 16px; padding: 14px 20px; box-shadow: 0 10px 24px rgba(59, 120, 192, .35);
}

/* floating nav */
#nav { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 9; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
#nav .in { pointer-events: auto; max-width: 400px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; background: var(--card); border-radius: 99px; padding: 4px; box-shadow: 0 10px 28px rgba(50, 90, 140, .18); }
.tab { display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: none; color: var(--mute); min-height: 46px; border-radius: 99px; font-weight: 800; font-size: 12.5px; padding: 0 4px; }
.tab[aria-current="page"] { background: var(--accent); color: var(--on-accent); }
.tab span { display: none; }
.tab[aria-current="page"] span { display: inline; }
.tab .ic { width: 20px; height: 20px; }

/* sheet */
#sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(20, 35, 55, .45); animation: fadeIn .25s ease both; }
#sheet .back { position: absolute; inset: 0; }
#panel {
  position: relative; width: 100%; max-width: 520px; max-height: 90%; overflow-y: auto; overscroll-behavior: contain; background: var(--card);
  border-radius: 26px 26px 0 0; display: grid; gap: 14px; animation: sheetUp .42s var(--ease) both;
  padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
}
#panel .stickyhead { position: sticky; top: -20px; border-radius: 26px 26px 0 0; z-index: 3; background: var(--card); margin: -20px -18px 0; padding: 20px 18px 12px; box-shadow: 0 8px 10px -8px rgba(20, 35, 55, .18); }
#panel h3 { margin: 0; font-size: 18px; font-weight: 800; padding-right: 44px; }
#panel h3 span { display: block; font-size: 13px; color: var(--mute); font-weight: 600; margin-top: 2px; }
.sx { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--bg); color: var(--mute); display: grid; place-items: center; padding: 0; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg); border-radius: 14px; padding: 4px; gap: 2px; }
.seg button { border: 0; background: none; color: var(--mute); font-weight: 800; padding: 11px 4px; border-radius: 11px; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.seg button[aria-pressed="true"][data-v="free"] { background: var(--free); color: var(--free-ink); box-shadow: none; }
.seg button[aria-pressed="true"][data-v="booked"] { background: var(--booked); color: var(--booked-ink); box-shadow: none; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 13.5px; font-weight: 700; max-width: 90%; }

/* drag select */
.slot, .wc { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.slot.sel, .wc.sel { box-shadow: inset 0 0 0 3px var(--accent); }
.slot.sel:not(.free):not(.booked), .wc.sel:not(.free):not(.booked) { background: var(--soft); }
body.dragging { cursor: grabbing; }
body.erase .slot.sel, body.erase .wc.sel { box-shadow: inset 0 0 0 3px var(--bad); }
#toast button { border: 0; background: none; color: var(--free); font-weight: 800; margin-left: 12px; padding: 0; }
.hint { margin: 0; font-size: 12.5px; color: var(--mute); font-weight: 700; }

/* intro loading screen */
body.intro-on { overflow: hidden; }
#intro { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: var(--bg); padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px); transition: opacity .5s ease, visibility .5s; }
#intro.out { opacity: 0; visibility: hidden; pointer-events: none; }
.in-box { display: grid; justify-items: center; gap: 16px; text-align: center; }
.in-logo { width: 78px; height: 78px; border-radius: 25px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 14px 34px rgba(59, 120, 192, .35); animation: introPop .75s var(--ease) both; }
.in-logo .ic { width: 40px; height: 40px; }
.in-title { font-size: 27px; font-weight: 800; line-height: 1.1; animation: rise .6s var(--ease) .15s backwards; }
.in-sub { font-size: 13.5px; color: var(--mute); font-weight: 700; margin-top: -10px; animation: rise .6s var(--ease) .25s backwards; }
.in-grid { display: grid; grid-template-columns: repeat(5, 30px); gap: 6px; margin-top: 6px; }
.in-grid i { height: 18px; border-radius: 7px; background: var(--line); animation: cellFill .5s ease both; animation-delay: calc(.4s + var(--i) * 40ms); }
.in-grid i.f { --c: var(--free); }
.in-grid i.b { --c: var(--booked); }
.in-bar { width: 170px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 8px; }
.in-bar b { display: block; height: 100%; background: var(--accent); border-radius: 99px; transform-origin: left; animation: introBar 1.6s cubic-bezier(.4, 0, .2, 1) both; }
#intro.done .in-bar b { animation: none; transform: scaleX(1); }
.in-msg { font-size: 12.5px; color: var(--mute); font-weight: 700; animation: fadeIn .6s ease .5s backwards; }
@keyframes introPop { from { opacity: 0; transform: scale(.6) rotate(-8deg); } }
@keyframes cellFill { from { opacity: 0; transform: scale(.6); background: var(--line); } to { opacity: 1; transform: scale(1); background: var(--c, var(--line)); } }
@keyframes introBar { from { transform: scaleX(0); } to { transform: scaleX(.92); } }

/* welcome */
#welcome { position: fixed; inset: 0; z-index: 55; display: grid; place-items: center; overflow-y: auto; background: var(--bg); padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); transition: opacity .5s ease, visibility .5s; }
#welcome.out { opacity: 0; visibility: hidden; pointer-events: none; }
.w-box { width: 100%; max-width: 360px; display: grid; gap: 14px; text-align: center; justify-items: center; }
#welcome:not(.show) .w-box { opacity: 0; }
#welcome.show .w-box > * { animation: rise .6s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 90ms); }
.w-logo { width: 72px; height: 72px; border-radius: 23px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 14px 34px rgba(59, 120, 192, .35); }
.w-logo .ic { width: 38px; height: 38px; }
.w-title { margin: 6px 0 0; font-size: 30px; font-weight: 800; line-height: 1.1; }
.w-sub { margin: 0; font-size: 16px; color: var(--mute); font-weight: 700; }
#w-name { text-align: center; font-weight: 700; font-size: 18px; margin-top: 6px; }
#w-go { margin-top: 2px; }
.save:disabled { opacity: .45; cursor: default; }

/* HR */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
.chips .pillbtn { white-space: nowrap; flex: none; }
.pillbtn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.slot.free .who { letter-spacing: 0; font-size: 13px; }
.slot:disabled { cursor: default; }
.wc[data-a] { cursor: pointer; }
.stars { display: flex; align-items: center; gap: 0; margin: 4px 0 2px -4px; }
.star { border: 0; background: none; padding: 4px; cursor: pointer; line-height: 0; border-radius: 10px; }
.star .st { width: 26px; height: 26px; fill: none; stroke: var(--mute); stroke-width: 1.7; stroke-linejoin: round; transition: fill .15s ease, stroke .15s ease; }
.star.on .st { fill: var(--star); stroke: var(--star); }
.stars .rt { margin-left: 8px; font-size: 12.5px; font-weight: 700; color: var(--mute); }
.tlist { display: grid; gap: 8px; }
.trow { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 13px 14px; border-radius: 16px; border: 2px solid transparent; background: var(--soft); color: var(--ink); font: inherit; font-weight: 800; text-align: left; cursor: pointer; }
.trow[aria-pressed="true"] { border-color: var(--accent); background: var(--card); }
.trow:disabled { opacity: .5; cursor: default; }
.trow .r { display: inline-flex; align-items: center; gap: 8px; color: var(--mute); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.trow .chip { padding: 3px 9px; }

.asg { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 4px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; border-radius: 0; }
.asg:first-child { border-top: 0; }
.stusticky { position: sticky; top: 0; z-index: 6; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
.sfilter { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
#stu-sec { scroll-margin-top: 10px; }
.statbtn { width: 100%; border: 0; background: none; font: inherit; padding: 0; cursor: pointer; text-align: left; align-items: center; color: var(--mute); }
.statbtn b { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); }
